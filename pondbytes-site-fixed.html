            <Icon name={icon} className="w-4 h-4" />
          </div>
        </div>
      );
    }

    function Icon({ name, className = "w-6 h-6", size = 24 }) {
      const props = { className, width: size, height: size, fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" };
      switch (name) {
        case 'Compass': return <svg {...props} viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>;
        case 'FlaskConical': return <svg {...props} viewBox="0 0 24 24"><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55A1 1 0 0 0 5.607 22h12.786a1 1 0 0 0 .886-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><line x1="8.5" y1="2" x2="15.5" y2="2"/><path d="M8.5 14h7"/></svg>;
        case 'Sprout': return <svg {...props} viewBox="0 0 24 24"><path d="M7 20h10"/><path d="M10 20c0-4.418 3.582-8 8-8v-1c-5.523 0-10 4.477-10 10z"/><path d="M14 20c0-7.732-6.268-14-14-14v1c7.18 0 13 5.82 13 13z"/></svg>;
        case 'DraftingCompass': return <svg {...props} viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="m10.5 6.5-6.6 14.2"/><path d="m13.5 6.5 6.6 14.2"/><path d="M7 15h10"/><path d="M12 3v2"/></svg>;
        case 'Fish': return <svg {...props} viewBox="0 0 24 24"><path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.46-4.94 6-8.5 6-3.56 0-6.06-2.54-7-6Z"/><path d="M18 12v.01"/><path d="M2 16l4.5-4L2 8"/></svg>;
        case 'Waves': return <svg {...props} viewBox="0 0 24 24"><path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/></svg>;
        case 'Search': return <svg {...props} viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
        case 'Sun': return <svg {...props} viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>;
        case 'Moon': return <svg {...props} viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>;
        case 'Globe': return <svg {...props} viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>;
        case 'ChevronDown': return <svg {...props} viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>;
        case 'Menu': return <svg {...props} viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>;
        case 'X': return <svg {...props} viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
        case 'Check': return <svg {...props} viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>;
        case 'Share2': return <svg {...props} viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>;
        case 'Shield': return <svg {...props} viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>;
        case 'Lock': return <svg {...props} viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
        case 'Mail': return <svg {...props} viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>;
        case 'WhatsApp': return <svg {...props} viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>;
        case 'Facebook': return <svg {...props} viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>;
        case 'Instagram': return <svg {...props} viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>;
        case 'Linkedin': return <svg {...props} viewBox="0 0 24 24"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>;
        case 'ArrowRight': return <svg {...props} viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>;
        case 'ArrowLeft': return <svg {...props} viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>;
        case 'Trash2': return <svg {...props} viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;
        default: return <svg {...props} viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>;
      }
    }

    function MainApp() {
      const [theme, setTheme] = useState(() => localStorage.getItem('pb_theme') || 'dark');
      const [lang, setLangState] = useState(() => localStorage.getItem('pb_lang') || 'ar');
      const [currentPage, setCurrentPage] = useState('home');
      const [selectedCategory, setSelectedCategory] = useState(null);
      const [selectedServiceForInquiry, setSelectedServiceForInquiry] = useState(null);
      const [selectedBlogSlug, setSelectedBlogSlug] = useState(null);
      
      const [isSearchOpen, setIsSearchOpen] = useState(false);
      const [isInquiryOpen, setIsInquiryOpen] = useState(false);
      const [isAdminOpen, setIsAdminOpen] = useState(false);
      const [selectedServiceDetail, setSelectedServiceDetail] = useState(null);

      const [blogPosts, setBlogPosts] = useState(() => {
        try {
          const saved = localStorage.getItem('pb_blog_posts');
          return saved ? JSON.parse(saved) : INITIAL_BLOG_POSTS;
        } catch (e) {
          return INITIAL_BLOG_POSTS;
        }
      });
      const [careersList, setCareersList] = useState(() => {
        try {
          const saved = localStorage.getItem('pb_careers_list');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });
      const [applyJobContext, setApplyJobContext] = useState(null); // null = closed. {} or job object = open
      const [isApplyOpen, setIsApplyOpen] = useState(false);

      const t = useMemo(() => TRANSLATIONS[lang] || TRANSLATIONS.ar, [lang]);

      // Every article added from the Admin Panel is saved here immediately,
      // so the Blog page always reflects the latest content — even after a refresh.
      useEffect(() => {
        localStorage.setItem('pb_blog_posts', JSON.stringify(blogPosts));
      }, [blogPosts]);

      // Every job opportunity added from the Admin Panel is saved here immediately,
      // so the Careers page always reflects the latest openings — even after a refresh.
      useEffect(() => {
        localStorage.setItem('pb_careers_list', JSON.stringify(careersList));
      }, [careersList]);

      useEffect(() => {
        localStorage.setItem('pb_theme', theme);
        document.documentElement.className = theme;
      }, [theme]);

      useEffect(() => {
        localStorage.setItem('pb_lang', lang);
        document.documentElement.dir = (lang === 'ar' ? 'rtl' : 'ltr');
        document.documentElement.lang = lang;
      }, [lang]);

      // Always scroll back to the top whenever the visible page changes,
      // so navigation (including footer links) is visibly effective even when
      // the click happens while scrolled far down the previous page.
      useEffect(() => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, [currentPage]);

      // On first load (and whenever the hash changes, e.g. via browser back/forward
      // or a shared link being opened), sync the visible page to the URL hash so
      // direct blog-post links actually open that post instead of the homepage.
      useEffect(() => {
        const applyHashRoute = () => {
          const hash = window.location.hash; // e.g. "#/blog/post-12345"
          const blogMatch = hash.match(/^#\/blog\/(.+)$/);
          if (blogMatch) {
            setSelectedBlogSlug(decodeURIComponent(blogMatch[1]));
            setCurrentPage('blog-detail');
          } else if (hash === '#/blog') {
            setCurrentPage('blog');
          } else if (hash === '#/careers') {
            setCurrentPage('careers');
          }
        };
        applyHashRoute();
        window.addEventListener('hashchange', applyHashRoute);
        return () => window.removeEventListener('hashchange', applyHashRoute);
      }, []);

      const changeLanguage = (newLang) => {
        setLangState(newLang);
        localStorage.setItem('pb_lang', newLang);
        document.documentElement.dir = (newLang === 'ar' ? 'rtl' : 'ltr');
        document.documentElement.lang = newLang;
      };

      const toggleTheme = () => setTheme(prev => prev === 'dark' ? 'light' : 'dark');

      const navigateToSolution = (categoryId) => {
        setSelectedCategory(categoryId);
        setCurrentPage('solution-category');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const openInquiryForService = (service) => {
        setSelectedServiceForInquiry(service);
        setIsInquiryOpen(true);
      };

      return (
        <ThemeContext.Provider value={{ theme, toggleTheme }}>
          <LanguageContext.Provider value={{ lang, setLang: changeLanguage, t }}>
            <div className={`min-h-screen flex flex-col ${theme === 'dark' ? 'bg-[#0b0f14] text-[#f5f7f8]' : 'bg-[#f5f7f8] text-[#0e2a3d]'}`}>
              
              <Header 
                currentPage={currentPage}
                setCurrentPage={setCurrentPage}
                navigateToSolution={navigateToSolution}
                onOpenSearch={() => setIsSearchOpen(true)}
                onOpenAdmin={() => setIsAdminOpen(true)}
              />

              <main className="flex-grow">
                {currentPage === 'home' && (
                  <HomePage 
                    navigateToSolution={navigateToSolution}
                    openInquiryForService={openInquiryForService}
                    setCurrentPage={setCurrentPage}
                  />
                )}

                {currentPage === 'solution-category' && (
                  <SolutionCategoryPage 
                    categoryId={selectedCategory}
                    openInquiryForService={openInquiryForService}
                  />
                )}

                {currentPage === 'about' && <AboutUsPage />}
                {currentPage === 'sustainability' && <SustainabilityPage />}
                {currentPage === 'services' && (
                  <ServicesPage 
                    openInquiryForService={openInquiryForService}
                    onSelectServiceDetail={setSelectedServiceDetail}
                  />
                )}
                {currentPage === 'growth' && <GrowthStoriesPage />}
                {currentPage === 'blog' && (
                  <BlogPage 
                    blogPosts={blogPosts}
                    onSelectPost={(slug) => {
                      setSelectedBlogSlug(slug);
                      setCurrentPage('blog-detail');
                      window.location.hash = '#/blog/' + slug;
                      window.scrollTo({ top: 0, behavior: 'smooth' });
                    }}
                  />
                )}
                {currentPage === 'blog-detail' && (
                  <BlogPostDetailPage 
                    slug={selectedBlogSlug}
                    blogPosts={blogPosts}
                    onBack={() => { setCurrentPage('blog'); window.location.hash = '#/blog'; }}
                  />
                )}
                {currentPage === 'careers' && (
                  <CareersPage
                    careersList={careersList}
                    onApply={(job) => { setApplyJobContext(job); setIsApplyOpen(true); }}
                  />
                )}
                {currentPage === 'contact' && <ContactPage />}
              </main>

              <Footer setCurrentPage={setCurrentPage} />
              <FloatingWhatsAppButton />

              {isSearchOpen && (
                <SearchModal 
                  onClose={() => setIsSearchOpen(false)}
                  blogPosts={blogPosts}
                  onNavigatePost={(slug) => {
                    setSelectedBlogSlug(slug);
                    setCurrentPage('blog-detail');
                    window.location.hash = '#/blog/' + slug;
                    setIsSearchOpen(false);
                  }}
                  onNavigateSolution={(catId) => {
                    navigateToSolution(catId);
                    setIsSearchOpen(false);
                  }}
                />
              )}

              {isInquiryOpen && (
                <InquiryFormModal 
                  initialService={selectedServiceForInquiry}
                  onClose={() => {
                    setIsInquiryOpen(false);
                    setSelectedServiceForInquiry(null);
                  }}
                />
              )}

              {selectedServiceDetail && (
                <ServiceDetailModal 
                  service={selectedServiceDetail}
                  onClose={() => setSelectedServiceDetail(null)}
                  onOpenInquiry={(srv) => {
                    setSelectedServiceDetail(null);
                    openInquiryForService(srv);
                  }}
                />
              )}

              {isAdminOpen && (
                <AdminModal 
                  onClose={() => setIsAdminOpen(false)}
                  blogPosts={blogPosts}
                  careersList={careersList}
                  onAddBlogPost={(newPost) => setBlogPosts(prev => [newPost, ...prev])}
                  onAddJob={(newJob) => setCareersList(prev => [newJob, ...prev])}
                  onDeleteBlogPost={(id) => setBlogPosts(prev => prev.filter(p => p.id !== id))}
                  onDeleteJob={(id) => setCareersList(prev => prev.filter(j => j.id !== id))}
                />
              )}

              {isApplyOpen && (
                <CvApplyModal
                  job={applyJobContext}
                  onClose={() => { setIsApplyOpen(false); setApplyJobContext(null); }}
                />
              )}

            </div>
          </LanguageContext.Provider>
        </ThemeContext.Provider>
      );
    }

    function Header({ currentPage, setCurrentPage, navigateToSolution, onOpenSearch, onOpenAdmin }) {
      const { theme, toggleTheme } = useContext(ThemeContext);
      const { lang, setLang, t } = useContext(LanguageContext);
      
      const [solutionsDropdownOpen, setSolutionsDropdownOpen] = useState(false);
      const [langDropdownOpen, setLangDropdownOpen] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      // EXACT LOGO SELECTION: Logo2.png for Dark Mode, Logo.png for Light Mode
      const logoSrc = theme === 'dark' ? 'https://i.ibb.co/LDgtQr79/Pond-Bytes-Logo2.png' : 'https://i.ibb.co/wFmV5qGg/Pond-Bytes-Logo.png';

      const handleLangSelect = (selectedLang) => {
        setLang(selectedLang);
        setLangDropdownOpen(false);
      };

      return (
        <header className={`sticky top-0 z-40 w-full backdrop-blur-md border-b transition-colors ${
          theme === 'dark' ? 'bg-[#0b0f14]/90 border-[#1e2836]' : 'bg-[#f5f7f8]/95 border-slate-300'
        }`}>
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            
            {/* LOGO */}
            <div className="flex items-center space-x-3 cursor-pointer rtl:space-x-reverse shrink-0" onClick={() => { setCurrentPage('home'); window.scrollTo({top:0, behavior:'smooth'}); }}>
              <img 
                src={logoSrc} 
                alt="PondBytes Logo" 
                className="h-11 sm:h-12 w-auto object-contain max-w-[130px] sm:max-w-[180px] transition-opacity duration-300"
              />
            </div>

            {/* Desktop Primary Nav */}
            <nav className={`hidden lg:flex items-center space-x-6 rtl:space-x-reverse text-sm font-bold ${
              theme === 'dark' ? 'text-slate-200' : 'text-[#0e2a3d]'
            }`}>
              <div className="relative">
                <button 
                  onClick={() => setSolutionsDropdownOpen(!solutionsDropdownOpen)}
                  className={`flex items-center space-x-1 rtl:space-x-reverse py-2 transition-colors ${
                    currentPage === 'solution-category' ? (theme === 'dark' ? 'text-[#f2c979]' : 'text-[#3d5afe]') : (theme === 'dark' ? 'hover:text-[#f2c979]' : 'hover:text-[#3d5afe]')
                  }`}
                >
                  <span>{t.navSolutions}</span>
                  <Icon name="ChevronDown" className="w-4 h-4" />
                </button>

                {/* STRICT 3 SOLUTIONS CATEGORIES DROPDOWN */}
                {solutionsDropdownOpen && (
                  <div className={`absolute top-full left-0 rtl:right-0 rtl:left-auto mt-2 w-60 rounded-2xl shadow-2xl border py-2 z-50 glass-panel-card ${
                    theme === 'dark' ? 'bg-[#121820] border-[#1e2836] text-white' : 'bg-white border-slate-300 text-[#0e2a3d]'
                  }`}>
                    {SOLUTION_CATEGORIES.map(cat => (
                      <button
                        key={cat.id}
                        onClick={() => { navigateToSolution(cat.id); setSolutionsDropdownOpen(false); }}
                        className={`w-full text-start px-4 py-3 text-xs font-black transition-all flex items-center justify-between hover:px-5 ${
                          theme === 'dark' ? 'hover:bg-[#0e2a3d] text-slate-200 hover:text-[#f2c979]' : 'hover:bg-slate-100 text-[#0e2a3d] hover:text-[#3d5afe]'
                        }`}
                      >
                        <span>{cat.title[lang] || cat.title.en}</span>
                        <Icon name={lang === 'ar' ? 'ArrowLeft' : 'ArrowRight'} className="w-3.5 h-3.5 opacity-70" />
                      </button>
                    ))}
                  </div>
                )}
              </div>

              <button onClick={() => setCurrentPage('about')} className={`py-2 transition-colors ${currentPage === 'about' ? (theme === 'dark' ? 'text-[#f2c979]' : 'text-[#3d5afe]') : ''}`}>{t.navAbout}</button>
              <button onClick={() => setCurrentPage('sustainability')} className={`py-2 transition-colors ${currentPage === 'sustainability' ? (theme === 'dark' ? 'text-[#f2c979]' : 'text-[#3d5afe]') : ''}`}>{t.navSustainability}</button>
              <button onClick={() => setCurrentPage('services')} className={`py-2 transition-colors ${currentPage === 'services' ? (theme === 'dark' ? 'text-[#f2c979]' : 'text-[#3d5afe]') : ''}`}>{t.navServices}</button>
              <button onClick={() => setCurrentPage('growth')} className={`py-2 transition-colors ${currentPage === 'growth' ? (theme === 'dark' ? 'text-[#f2c979]' : 'text-[#3d5afe]') : ''}`}>{t.navGrowth}</button>
              <button onClick={() => setCurrentPage('blog')} className={`py-2 transition-colors ${currentPage === 'blog' ? (theme === 'dark' ? 'text-[#f2c979]' : 'text-[#3d5afe]') : ''}`}>{t.navBlog}</button>
              <button onClick={() => setCurrentPage('careers')} className={`py-2 transition-colors ${currentPage === 'careers' ? (theme === 'dark' ? 'text-[#f2c979]' : 'text-[#3d5afe]') : ''}`}>{t.navCareers}</button>
              <button onClick={() => setCurrentPage('contact')} className={`py-2 transition-colors ${currentPage === 'contact' ? (theme === 'dark' ? 'text-[#f2c979]' : 'text-[#3d5afe]') : ''}`}>{t.navContact}</button>
            </nav>

            {/* Controls */}
            <div className="flex items-center space-x-1.5 sm:space-x-3 rtl:space-x-reverse shrink-0">
              <button onClick={onOpenSearch} aria-label="Search" className={`hidden sm:inline-flex p-2 rounded-lg transition-colors ${theme === 'dark' ? 'hover:bg-[#0e2a3d] text-slate-200' : 'hover:bg-slate-200 text-[#0e2a3d]'}`}>
                <Icon name="Search" className="w-5 h-5" />
              </button>

              {/* STATEFUL LANGUAGE SELECTOR */}
              <div className="relative hidden sm:block">
                <button 
                  onClick={() => setLangDropdownOpen(!langDropdownOpen)}
                  className={`flex items-center space-x-1.5 rtl:space-x-reverse px-2.5 sm:px-3 py-1.5 rounded-lg border text-xs font-black transition-colors ${
                    theme === 'dark' ? 'border-[#1e2836] bg-[#121820] text-slate-200 hover:border-[#3d5afe]' : 'border-slate-300 bg-white text-[#0e2a3d] hover:border-[#3d5afe]'
                  }`}
                >
                  <Icon name="Globe" className="w-3.5 h-3.5" />
                  <span>{lang.toUpperCase()}</span>
                  <Icon name="ChevronDown" className="w-3 h-3" />
                </button>

                {langDropdownOpen && (
                  <div className={`absolute top-full right-0 rtl:left-0 rtl:right-auto mt-2 w-36 rounded-xl shadow-2xl border py-1.5 z-50 ${
                    theme === 'dark' ? 'bg-[#121820] border-[#1e2836] text-white' : 'bg-white border-slate-300 text-[#0e2a3d]'
                  }`}>
                    <button onClick={() => handleLangSelect('ar')} className={`w-full text-start px-3.5 py-2 text-xs font-bold transition-colors flex items-center justify-between ${lang === 'ar' ? 'bg-[#3d5afe]/20 text-[#3d5afe]' : 'hover:bg-slate-500/10'}`}>
                      <span>العربية (AR)</span>
                      {lang === 'ar' && <Icon name="Check" className="w-3.5 h-3.5 text-emerald-400" />}
                    </button>
                    <button onClick={() => handleLangSelect('en')} className={`w-full text-start px-3.5 py-2 text-xs font-bold transition-colors flex items-center justify-between ${lang === 'en' ? 'bg-[#3d5afe]/20 text-[#3d5afe]' : 'hover:bg-slate-500/10'}`}>
                      <span>English (EN)</span>
                      {lang === 'en' && <Icon name="Check" className="w-3.5 h-3.5 text-emerald-400" />}
                    </button>
                    <button onClick={() => handleLangSelect('fr')} className={`w-full text-start px-3.5 py-2 text-xs font-bold transition-colors flex items-center justify-between ${lang === 'fr' ? 'bg-[#3d5afe]/20 text-[#3d5afe]' : 'hover:bg-slate-500/10'}`}>
                      <span>Français (FR)</span>
                      {lang === 'fr' && <Icon name="Check" className="w-3.5 h-3.5 text-emerald-400" />}
                    </button>
                  </div>

    // --- CV / RESUME APPLICATION MODAL ---
    // Sends the applicant's text details (name/email/phone/message) instantly to
    // info.pondbytes@gmail.com via FormSubmit's AJAX endpoint — this part is proven reliable.
    // FormSubmit's file-attachment feature (both the classic multipart POST and the /ajax/ endpoint)
    // has repeatedly failed to deliver the actual CV file to the inbox in testing, even though it's
    // documented to work. To guarantee the CV itself actually arrives, we don't rely on a third-party
    // relay for the file at all: right after the text notification is sent, we open the applicant's
    // own email app with a pre-filled message — they just attach the CV and hit send themselves,
    // which is 100% reliable because it goes out from their own mail client, not through FormSubmit.
    function CvApplyModal({ job, onClose }) {
      const { theme } = useContext(ThemeContext);
      const { lang, t } = useContext(LanguageContext);

      const [fullName, setFullName] = useState('');
      const [email, setEmail] = useState('');
      const [phone, setPhone] = useState('');
      const [message, setMessage] = useState('');
      const [cvFile, setCvFile] = useState(null);
      const [status, setStatus] = useState('idle'); // idle | sending | success | error

      const positionName = job ? (job.title[lang] || job.title.en) : t.generalPositionValue;

      const handleFileChange = (e) => {
        const file = e.target.files && e.target.files[0];
        setCvFile(file || null);
      };

      // Builds a Gmail web-compose link pre-filled with the applicant's info. We deliberately use
      // Gmail's compose URL instead of mailto: — mailto: only works if the device has a default
      // email client configured (many Windows PCs don't), so it silently does nothing for a lot of
      // users. The Gmail compose URL always opens in a new browser tab, guaranteed.
      // Neither method can attach files automatically, so the applicant attaches the CV themselves
      // right before sending — that's the step that actually guarantees the file arrives.
      const mailtoBody =
        `Name: ${fullName}\nEmail: ${email}\nPhone: ${phone}\nPosition: ${positionName}\n\nMessage:\n${message}\n\n(Please attach your CV/Resume file — "${cvFile ? cvFile.name : 'your CV'}" — to this email before sending)`;
      const mailtoUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=info.pondbytes@gmail.com&su=${encodeURIComponent(`New Job Application - ${positionName}`)}&body=${encodeURIComponent(mailtoBody)}`;

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!cvFile) return;
        setStatus('sending');

        // Open Gmail compose right away, still inside the click handler (before any await),
        // so browsers don't treat it as a blocked popup.
        window.open(mailtoUrl, '_blank');

        try {
          const formData = new FormData();
          formData.append('name', fullName);
          formData.append('email', email);
          formData.append('phone', phone);
          formData.append('position', positionName);
          formData.append('message', message);
          formData.append('cv_filename_note', `Applicant's CV file "${cvFile.name}" will follow in a separate email from the applicant's own address.`);
          formData.append('_subject', `New Job Application - ${positionName}`);
          formData.append('_template', 'table');
          formData.append('_captcha', 'false');

          const response = await fetch('https://formsubmit.co/ajax/info.pondbytes@gmail.com', {
            method: 'POST',
            body: formData,
            headers: { 'Accept': 'application/json' }
          });

          if (!response.ok) throw new Error('Request failed');
          setStatus('success');
        } catch (err) {
          setStatus('error');
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm overflow-y-auto">
          <div className={`relative w-full max-w-xl rounded-3xl border shadow-2xl p-6 sm:p-8 my-8 max-h-[90vh] overflow-y-auto ${theme === 'dark' ? 'bg-[#121820] border-[#1e2836] text-white' : 'bg-white border-slate-300 text-[#0e2a3d]'}`}>
            <button onClick={onClose} className="absolute top-6 right-6 rtl:left-6 rtl:right-auto p-2 rounded-full hover:bg-slate-500/20"><Icon name="X" className="w-5 h-5" /></button>

            {status !== 'success' ? (
              <form onSubmit={handleSubmit} className="space-y-5">

                <div>
                  <h2 className={`text-2xl font-black ${theme === 'dark' ? 'text-[#f2c979]' : 'text-[#0e2a3d]'}`}>{t.applyModalTitle}</h2>
                  <p className={`text-xs mt-1 font-bold ${theme === 'dark' ? 'text-slate-400' : 'text-slate-600'}`}>{t.applyModalSubtitle}</p>
                </div>

                <div>
                  <label className="text-xs font-bold block mb-1">{t.positionLabel}</label>
                  <input type="text" readOnly value={positionName} className={`w-full px-4 py-2.5 rounded-xl border text-sm outline-none ${theme === 'dark' ? 'bg-[#0b0f14]/60 border-[#1e2836] text-slate-300' : 'bg-slate-100 border-slate-300 text-slate-600'}`} />
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="text-xs font-bold block mb-1">{t.applicantName} *</label>
                    <input type="text" name="name" required value={fullName} onChange={e => setFullName(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border bg-transparent text-sm focus:border-[#3d5afe] outline-none" />
                  </div>
                  <div>
                    <label className="text-xs font-bold block mb-1">{t.applicantEmail} *</label>
                    <input type="email" name="email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border bg-transparent text-sm focus:border-[#3d5afe] outline-none" />
                  </div>
                </div>

                <div>
                  <label className="text-xs font-bold block mb-1">{t.applicantPhone} *</label>
                  <input type="tel" name="phone" required value={phone} onChange={e => setPhone(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border bg-transparent text-sm focus:border-[#3d5afe] outline-none" />
                </div>

                <div>
                  <label className="text-xs font-bold block mb-1">{t.coverMessageLabel}</label>
                  <textarea name="message" value={message} onChange={e => setMessage(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border bg-transparent text-sm focus:border-[#3d5afe] outline-none h-24" />
                </div>

                <div>
                  <label className="text-xs font-bold block mb-1">{t.cvFileLabel} *</label>
                  <input
                    type="file"

                    required
                    accept=".pdf,.doc,.docx"
                    onChange={handleFileChange}
                    className={`w-full text-xs font-semibold px-4 py-2.5 rounded-xl border outline-none file:me-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:font-bold file:bg-[#3d5afe] file:text-white ${theme === 'dark' ? 'bg-transparent border-[#1e2836]' : 'bg-transparent border-slate-300'}`}
                  />
                  <p className={`text-[11px] mt-1 font-semibold ${theme === 'dark' ? 'text-slate-400' : 'text-slate-600'}`}>{t.cvFileHint}</p>
                </div>

                {status === 'error' && (
                  <div className="space-y-3">
                    <p className="text-xs font-bold text-red-500">{t.cvErrorMsg}</p>
                    <a
                      href={mailtoUrl}
                      target="_blank"
                      rel="noreferrer"
                      className="w-full inline-flex items-center justify-center gap-2 py-3 rounded-xl font-bold text-xs border border-[#3d5afe] text-[#3d5afe] hover:bg-[#3d5afe]/10 transition-all"
                    >
                      <Icon name="Mail" className="w-4 h-4" />
                      <span>{t.cvMailtoFallbackBtn}</span>
                    </a>
                    <p className={`text-[11px] font-semibold ${theme === 'dark' ? 'text-slate-400' : 'text-slate-600'}`}>{t.cvMailtoFallbackHint}</p>
                  </div>
                )}

                <button type="submit" disabled={status === 'sending'} className="w-full py-3.5 rounded-xl font-bold text-xs sm:text-sm bg-[#3d5afe] text-white hover:bg-[#3d5afe]/90 transition-all shadow-lg disabled:opacity-60">
                  {status === 'sending' ? t.sendingBtn : t.applySubmitBtn}
                </button>
              </form>
            ) : (
              <div className="text-center py-8 space-y-6">
                <div className="w-16 h-16 rounded-full bg-emerald-500/20 text-emerald-400 mx-auto flex items-center justify-center"><Icon name="Check" className="w-8 h-8" /></div>
                <h3 className="text-2xl font-black text-emerald-500 dark:text-emerald-400">{t.cvSuccessTitle}</h3>
                <p className="text-xs sm:text-sm font-bold text-slate-400 leading-relaxed max-w-md mx-auto">{t.cvSuccessDesc}</p>
                <button onClick={onClose} className="w-full py-2.5 rounded-xl border text-xs font-bold text-slate-500 hover:text-slate-800 dark:hover:text-white">{t.closeModal}</button>
              </div>
            )}
          </div>
        </div>
      );
    }

      const { lang } = useContext(LanguageContext);

        <div

        </div>
